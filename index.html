<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Розклад+</title>
  
  <meta name="description" content="Розклад занять та швидкий доступ до Google Meet.">
  <meta name="theme-color" content="#f5f5f7" id="meta-theme-color">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/schedule-plus.svg">
  <link rel="apple-touch-icon" href="assets/schedule-plus.svg">
  <meta name="apple-mobile-web-app-title" content="Розклад+">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <div class="header-top">
        <h1 class="app-title">Розклад<span class="plus-accent">+</span></h1>
        
        <div class="header-controls">
          <button class="group-select-btn" id="desktopProfileBtn" aria-label="Обрати групу" title="Обрати групу">
            <i class="ph ph-graduation-cap"></i>
            <span class="selected-group-name">КІБ-25011б</span>
            <i class="ph ph-caret-down"></i>
          </button>

          <div class="segmented-control" id="weekToggle">
            <input type="radio" id="num-week" name="week-type" value="numerator" checked>
            <label for="num-week" id="num-label">Чисельник</label>
            <input type="radio" id="den-week" name="week-type" value="denominator">
            <label for="den-week" id="den-label">Знаменник</label>
            <div class="segmented-control-indicator"></div>
          </div>

          <div class="desktop-actions">
            <button class="desktop-icon-btn theme-toggle-btn" aria-label="Перемкнути тему" title="Перемкнути тему">
              <i class="ph ph-moon"></i>
            </button>
            <button class="desktop-icon-btn notify-toggle-btn" aria-label="Сповіщення" title="Увімкнути сповіщення">
              <i class="ph ph-bell"></i>
            </button>
            <a href="https://send.monobank.ua/jar/5D1FB9SMrA" target="_blank" rel="noopener noreferrer" class="desktop-icon-btn support-btn" aria-label="Підтримати проєкт" title="Підтримати проєкт">
              <i class="ph ph-coffee"></i>
            </a>
            <a href="https://t.me/schedule_plus" target="_blank" rel="noopener noreferrer" class="desktop-icon-btn telegram-btn" aria-label="Telegram" title="Telegram">
              <i class="ph ph-telegram-logo"></i>
            </a>
          </div>
        </div>
      </div>

      <nav class="days-nav">
        <ul class="days-list" id="daysList">
          <li><button class="day-tab" data-day="1">Пн</button></li>
          <li><button class="day-tab" data-day="2">Вт</button></li>
          <li><button class="day-tab" data-day="3">Ср</button></li>
          <li><button class="day-tab" data-day="4">Чт</button></li>
          <li><button class="day-tab" data-day="5">Пт</button></li>
          <li id="satTabItem" style="display: none;"><button class="day-tab" data-day="6">Сб</button></li>
        </ul>
      </nav>
    </header>

    <main class="app-main">
      <div id="scheduleContainer" class="schedule-grid">
        <!-- 5 day columns rendered by app.js -->
      </div>
    </main>

    <!-- Mobile Group Select Floating Bar -->
    <div class="mobile-group-bar">
      <button class="group-select-btn mobile-btn" id="mobileProfileBtn">
        <i class="ph ph-graduation-cap"></i>
        <span class="selected-group-name">Мій розклад</span>
        <i class="ph ph-caret-down"></i>
      </button>
    </div>

    <footer class="app-footer">
      <div class="footer-controls">
        <button class="footer-btn theme-toggle-btn" aria-label="Перемкнути тему">
          <i class="ph ph-moon"></i>
          <span>Тема</span>
        </button>
        <button class="footer-btn notify-toggle-btn" aria-label="Увімкнути сповіщення">
          <i class="ph ph-bell"></i>
          <span>Сповіщення</span>
        </button>
        <a href="https://send.monobank.ua/jar/5D1FB9SMrA" target="_blank" rel="noopener noreferrer" class="footer-btn support-btn" aria-label="Підтримати">
          <i class="ph ph-coffee"></i>
          <span>Підтримати</span>
        </a>
        <a href="https://t.me/schedule_plus" target="_blank" rel="noopener noreferrer" class="footer-btn telegram-btn" aria-label="Зв'язок в телеграмі">
          <i class="ph ph-telegram-logo"></i>
          <span>Telegram</span>
        </a>
      </div>
    </footer>
  </div>

  
    <!-- Profile / Schedules Modal -->
    <div class="modal-backdrop" id="profileModalBackdrop">
      <div class="group-modal" id="profileModal" style="max-width: 480px; width: 95%; display: flex; flex-direction: column;">
        <div class="group-modal-header">
          <div class="modal-title-wrapper">
            <i class="ph ph-graduation-cap"></i>
            <h3>Мої розклади</h3>
          </div>
          <button class="modal-close-btn" id="closeProfileModal" aria-label="Закрити">
            <i class="ph ph-x"></i>
          </button>
        </div>

        <div class="profile-modal-content">
          
          <!-- Section 1: Active Schedule Card -->
          <div class="profile-section">
            <div class="profile-section-header">
              <span class="profile-section-title">Активний розклад</span>
              <span class="active-pill-badge"><i class="ph ph-check-circle"></i> Зараз на екрані</span>
            </div>

            <div class="active-schedule-card">
              <div class="active-schedule-name-row">
                <input type="text" id="profileNameInput" placeholder="Назва розкладу" autocomplete="off">
                <button id="saveProfileBtn" class="active-schedule-save-btn" title="Зберегти змінену назву">
                  Зберегти
                </button>
              </div>

              <button id="editScheduleBtn" class="active-schedule-edit-btn">
                <i class="ph ph-pencil-simple"></i>
                <span>Редагувати пари цього розкладу</span>
              </button>
            </div>
          </div>

          <!-- Section 2: All Schedules List -->
          <div class="profile-section">
            <div class="profile-section-header">
              <span class="profile-section-title">Перемикання розкладів</span>
              <span style="font-size: 11.5px; color: var(--color-ash);">Клікніть для вибору</span>
            </div>
            
            <div id="profilesListContainer" class="profiles-list-container">
              <!-- Dynamically populated profile items -->
            </div>
          </div>

          <!-- Section 3: Add new schedule -->
          <div class="profile-section">
            <div class="profile-section-header">
              <span class="profile-section-title">Додати новий розклад</span>
            </div>

            <div class="add-schedule-box">
              <button id="addEmptyProfileBtn" class="add-empty-btn">
                <i class="ph ph-plus-circle"></i>
                <span>Створити порожній розклад</span>
              </button>

              <div class="add-schedule-row">
                <div class="custom-select-container" id="templateSelectWrapper" style="flex: 1;">
                  <div class="custom-select-trigger">
                    <span class="custom-select-text">Оберіть готовий шаблон...</span>
                    <i class="ph ph-caret-down custom-select-caret"></i>
                  </div>
                  <div class="custom-select-options">
                    <div class="custom-select-option selected" data-value="">
                      <span class="opt-content" style="color: var(--color-ash);">Оберіть готовий шаблон...</span>
                      <i class="ph ph-check check-icon"></i>
                    </div>
                    <div class="custom-select-option" data-value="КІБ-25011б">
                      <span class="opt-content" style="display: flex; align-items: center; gap: 8px;">
                        <i class="ph ph-graduation-cap" style="color: var(--color-accent);"></i>
                        <strong>КІБ-25011б</strong>
                      </span>
                      <i class="ph ph-check check-icon"></i>
                    </div>
                  </div>
                  <input type="hidden" id="templateSelect" value="">
                </div>

                <button id="loadTemplateBtn" class="template-add-btn" title="Додати розклад із вибраного шаблону">
                  <i class="ph ph-download-simple"></i>
                  <span>Додати</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Section: Import / Export -->
          <div class="profile-section">
            <div class="profile-section-header">
              <span class="profile-section-title">Експорт та Імпорт розкладу</span>
            </div>
            
            <div class="import-export-actions" style="display: flex; gap: 10px; margin-top: 10px;">
              <button id="exportScheduleBtn" class="add-empty-btn" style="flex: 1;">
                <i class="ph ph-share-network"></i>
                <span>Експортувати</span>
              </button>
              
              <button id="importScheduleBtn" class="add-empty-btn" style="flex: 1;">
                <i class="ph ph-upload-simple"></i>
                <span>Імпортувати</span>
              </button>
              <input type="file" id="importScheduleInput" accept=".json" style="display: none;">
            </div>
          </div>

          <!-- Section 4: Clear active schedule -->
          <div class="profile-danger-actions">
            <button id="resetScheduleBtn" class="clear-classes-link-btn">
              <i class="ph ph-trash"></i>
              <span>Очистити всі пари активного розкладу</span>
            </button>
          </div>

        </div>
      </div>
    </div>

    <!-- Editor Modal -->
    <div class="modal-backdrop" id="editorModalBackdrop" style="z-index: 9999;">
      <div class="group-modal" id="editorModal" style="max-width: 800px; width: 95%; max-height: 90vh;">
        <div class="group-modal-header">
          <div class="modal-title-wrapper">
            <i class="ph ph-pencil-simple"></i>
            <h3>Редактор розкладу</h3>
          </div>
          <button class="modal-close-btn" id="closeEditorModal" aria-label="Закрити">
            <i class="ph ph-x"></i>
          </button>
        </div>
        <div class="editor-modal-controls">
          <div class="segmented-control" id="editorWeekToggle" data-week="numerator">
            <input type="radio" name="editor-week-type" id="editor-num-week" value="numerator" checked>
            <input type="radio" name="editor-week-type" id="editor-den-week" value="denominator">
            <label for="editor-num-week" id="editor-num-label">Чисельник</label>
            <label for="editor-den-week" id="editor-den-label">Знаменник</label>
            <div class="segmented-control-indicator"></div>
          </div>
          
          <div id="editorDaysNav">
             <button class="course-chip active" data-editday="1">ПН</button>
             <button class="course-chip" data-editday="2">ВТ</button>
             <button class="course-chip" data-editday="3">СР</button>
             <button class="course-chip" data-editday="4">ЧТ</button>
             <button class="course-chip" data-editday="5">ПТ</button>
             <button class="course-chip" data-editday="6">СБ</button>
          </div>
        </div>

        <div class="group-modal-body editor-classes-body">
          <div id="editorClassesContainer">
             <!-- Classes will be listed here by JS -->
          </div>
          
          <button id="addClassBtn" class="add-class-dashed-btn">
            <i class="ph ph-plus"></i>
            <span>Додати пару</span>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Edit Class Modal (Nested) -->
    <div class="modal-backdrop" id="editClassModalBackdrop" style="z-index: 10000;">
      <div class="group-modal" id="editClassModal" style="max-width: 400px; width: 95%;">
        <div class="group-modal-header">
          <div class="modal-title-wrapper">
            <i class="ph ph-book-open"></i>
            <h3 id="editClassTitle">Редагування пари</h3>
          </div>
          <button class="modal-close-btn" id="closeEditClassModal" aria-label="Закрити">
            <i class="ph ph-x"></i>
          </button>
        </div>
        <div class="group-modal-body" style="display:flex; flex-direction:column; gap:12px; padding-top: 10px;">
          <input type="hidden" id="editClassId">
          <div style="display:flex; flex-direction:column; gap: 6px;">
            <label style="font-size: 13px; font-weight: 600; color: var(--color-ash);">Номер пари (1-7)</label>
            <input type="number" id="editClassNum" class="form-input" min="1" max="7" style="padding: 12px; border-radius: 12px; border: 1px solid var(--color-mist); background: var(--color-pebble); color: var(--color-carbon);">
          </div>
          <div style="display:flex; flex-direction:column; gap: 6px;">
            <label style="font-size: 13px; font-weight: 600; color: var(--color-ash);">Предмет</label>
            <input type="text" id="editClassSubject" class="form-input" style="padding: 12px; border-radius: 12px; border: 1px solid var(--color-mist); background: var(--color-pebble); color: var(--color-carbon);">
          </div>
          <div style="display:flex; flex-direction:column; gap: 6px;">
            <label style="font-size: 13px; font-weight: 600; color: var(--color-ash);">Локація (аудиторія)</label>
            <input type="text" id="editClassLocation" class="form-input" placeholder="напр. 214 к.15" style="padding: 12px; border-radius: 12px; border: 1px solid var(--color-mist); background: var(--color-pebble); color: var(--color-carbon);">
          </div>
          <div style="display:flex; flex-direction:column; gap: 6px;">
            <label style="font-size: 13px; font-weight: 600; color: var(--color-ash);">Власне посилання (Meet/Zoom/Тощо)</label>
            <input type="url" id="editClassLink" class="form-input" placeholder="https://meet.google.com/..." style="padding: 12px; border-radius: 12px; border: 1px solid var(--color-mist); background: var(--color-pebble); color: var(--color-carbon);">
          </div>
          <div style="display:flex; flex-direction:column; gap: 6px;">
            <label style="font-size: 13px; font-weight: 600; color: var(--color-ash);">Тип заняття</label>
            <div class="custom-select-container" id="editClassTypeWrapper">
              <div class="custom-select-trigger">
                <span class="custom-select-text">
                  <span class="class-type lecture">Лекція</span>
                </span>
                <i class="ph ph-caret-down custom-select-caret"></i>
              </div>
              <div class="custom-select-options">
                <div class="custom-select-option selected" data-value="Лекція">
                  <span class="opt-content">
                    <span class="class-type lecture">Лекція</span>
                  </span>
                  <i class="ph ph-check check-icon"></i>
                </div>
                <div class="custom-select-option" data-value="Практика">
                  <span class="opt-content">
                    <span class="class-type practice">Практика</span>
                  </span>
                  <i class="ph ph-check check-icon"></i>
                </div>
              </div>
              <input type="hidden" id="editClassType" value="Лекція">
            </div>
          </div>
          <div style="display:flex; gap: 12px; margin-top: 12px;">
             <button id="saveClassBtn" style="flex: 1; background: var(--color-accent); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;">Зберегти</button>
             <button id="deleteClassBtn" style="background: #ff3b30; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; display: none;"><i class="ph ph-trash"></i></button>
          </div>
        </div>
      </div>
    </div>

  <script src="app.js"></script>
</body>
</html>
